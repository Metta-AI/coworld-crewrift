# Build and deploy the source-owned shared Crewrift Coworld catalog.
#
# Lifecycle:
#   1. `coworld build` builds the package services from compose.yaml, pins
#      source URLs to this checkout, stamps the next version, and writes the
#      hydrated manifest.
#   2. Upload that exact hydrated manifest. Upload queues hosted certification
#      and does not patch an existing hosted Coworld.
#   3. Wait for the complete hosted certification transcript, not only the
#      initial smoke upload gate.
#
# Required repository secret:
#   SOFTMAX_API_TOKEN  - a TEAM `usr_` token. Set it in
#                        Settings -> Secrets and variables -> Actions.
#                        The `coworld`/`softmax` CLI reads its bearer token from
#                        ~/.softmax/credentials.yaml, NOT from this env var, so the
#                        workflow seeds it headlessly via `softmax set-token`.
#
# The Coworld CLI is installed from the public package repo so deploys use the
# current registry/version allocator and project-owned replay-viewer build
# contract without waiting for a PyPI/package release.
name: "Deploy Crewrift Game"

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      version:
        description: "Explicit crewrift version to publish. Leave blank to auto-resolve."
        required: false
        default: ""
      skip_upload:
        description: "Skip coworld upload-coworld (build only)."
        type: boolean
        default: false

concurrency:
  group: deploy-game
  cancel-in-progress: false

env:
  COWORLD_CLI: "coworld[auth] @ git+https://github.com/Metta-AI/coworld.git@main"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: SOFTMAX_OBSERVATORY
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v6

      - name: Install coworld CLI
        run: uvx --from "$COWORLD_CLI" coworld --help >/dev/null

      - uses: treeform/setup-nim-action@v6

      - name: Install Nim dependencies
        run: nimby sync nimby.lock -g

      - uses: emscripten-core/setup-emsdk@v16
        with:
          version: 6.0.3

      - uses: docker/setup-buildx-action@v3

      - name: Preflight Docker (required for build)
        run: |
          docker version
          docker info
          if ! docker compose version >/dev/null 2>&1; then
            echo "docker compose plugin missing; installing docker-compose-plugin..."
            sudo apt-get update
            sudo apt-get install -y docker-compose-plugin
          fi
          docker compose version
          docker ps >/dev/null

      - name: Seed Softmax credentials
        env:
          SOFTMAX_API_TOKEN: ${{ secrets.SOFTMAX_API_TOKEN }}
        run: |
          if [ -z "$SOFTMAX_API_TOKEN" ]; then
            echo "::error::SOFTMAX_API_TOKEN secret is empty. Set a team usr_ token in repo Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          uvx --from "$COWORLD_CLI" softmax set-token "$SOFTMAX_API_TOKEN" --server https://softmax.com/api
          uv run --with "$COWORLD_CLI" python3 -c "from softmax.auth import clear_active_player_session; clear_active_player_session(server='https://softmax.com/api')"

      - name: Resolve next version
        id: ver
        run: |
          set -euo pipefail
          INPUT_VERSION="${{ inputs.version || '' }}"
          if [ -n "$INPUT_VERSION" ]; then
            NEXT="$INPUT_VERSION"
          else
            NEXT=$(uvx --from "$COWORLD_CLI" coworld --elevated next-version crewrift)
          fi
          echo "version=${NEXT}" >> "$GITHUB_OUTPUT"
          echo "Deploying crewrift:${NEXT}"

      - name: Build hydrated Coworld manifest
        run: |
          uvx --from "$COWORLD_CLI" coworld build \
            --project . \
            --template coworld_manifest_template.json \
            --version "${{ steps.ver.outputs.version }}" \
            --output tmp/crewrift/dist/coworld_manifest.json

      - name: Upload hydrated Coworld manifest
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.skip_upload != 'true' }}
        run: |
          uvx --from "$COWORLD_CLI" coworld --elevated upload-coworld \
            tmp/crewrift/dist/coworld_manifest.json \
            --wait-hosted-smoke \
            --hosted-smoke-timeout-seconds 1800

      - name: Verify canonical upload
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.skip_upload != 'true' }}
        run: |
          set -euo pipefail
          COWORLD_ID="$({ uvx --from "$COWORLD_CLI" coworld --elevated list --json --limit 500; } \
            | jq -r --arg version "${{ steps.ver.outputs.version }}" \
              '.[] | select(.name == "crewrift" and .version == $version) | .id')"
          if [ -z "$COWORLD_ID" ]; then
            echo "::error::Uploaded crewrift:${{ steps.ver.outputs.version }} not found"
            exit 1
          fi
          for attempt in $(seq 1 90); do
            STATUS="$(uvx --from "$COWORLD_CLI" coworld --elevated status "$COWORLD_ID" --json)"
            STATE="$(jq -r '.certification.state // "pending"' <<<"$STATUS")"
            if [ "$STATE" = "certified" ]; then
              echo "crewrift:${{ steps.ver.outputs.version }} is canonical and certified ($COWORLD_ID)"
              exit 0
            fi
            if [ "$STATE" = "failed" ]; then
              jq '.certification' <<<"$STATUS"
              exit 1
            fi
            echo "Certification state: $STATE (attempt $attempt/90)"
            sleep 20
          done
          echo "::error::Timed out waiting for complete hosted certification of $COWORLD_ID"
          exit 1
