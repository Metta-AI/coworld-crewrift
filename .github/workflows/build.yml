name: Github Actions
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - run: node --test tests/test_replay_artifact_url.mjs
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libevdev-dev
      - uses: treeform/setup-nim-action@v6
      - run: |
          cd ..
          nimby create
          nimby sync "$GITHUB_WORKSPACE/nimby.lock"
      - run: nim check src/crewrift.nim
      - run: nim r tests/tests.nim
