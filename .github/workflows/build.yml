name: Github Actions
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - run: node --test tests/test_replay_artifact_url.mjs
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libevdev-dev libcurl4
      - uses: treeform/setup-nim-action@v6
      - run: nimby create && nimby sync nimby.lock -g
      - run: nim check src/crewrift.nim
      - run: nim r tests/tests.nim
      - name: Native notsus transport regression
        run: |
          nim c --threads:on -d:release --out:/tmp/notsus-native-probe tests/test_notsus_native_llm.nim
          python3 tests/test_notsus_native_http.py /tmp/notsus-native-fixture /tmp/notsus-native-probe
          python3 tests/test_notsus_native_cancel.py /tmp/notsus-native-cancel /tmp/notsus-native-probe
          nim c --threads:on -d:release -d:botHeadless -d:useMalloc --opt:speed --stackTrace:on --out:/tmp/notsus-cli players/notsus/notsus.nim
          python3 tests/test_notsus_scripted_startup.py /tmp/notsus-startup-fixture /tmp/notsus-cli

  language-players:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: Metta-AI/coworld-tools
          path: .shared-tools
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install pydantic numpy cramjam pytest pytest-asyncio websockets httpx
      - name: Meeting and commander native routing
        env:
          PYTHONPATH: players/crewborg:.shared-tools/players
        run: >-
          python -m pytest players/crewborg/crewborg/tests/test_native_llm.py
          players/crewborg/crewborg/tests/test_meeting_llm.py
          players/crewborg/crewborg/tests/test_commander*
          players/crewborg/crewborg/tests/test_owned_native.py
          players/crewborg/crewborg/tests/test_native_admission.py
          players/crewborg/crewborg/tests/test_bridge.py -q
      - name: Self-contained meeting player
        env:
          PYTHONPATH: players/crewborg-aaln
        run: >-
          python -m pytest players/crewborg-aaln/players/crewrift/crewborg/tests/test_meeting_modes.py
          players/crewborg-aaln/players/crewrift/crewborg/tests/test_owned_native.py
          players/crewborg-aaln/players/crewrift/crewborg/tests/test_bridge.py -q
